<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzKOCTQ55EodlvAF712d_GlVlA8UTHJrk",
    authDomain: "twincare-ai-7a018.firebaseapp.com",
    projectId: "twincare-ai-7a018",
    storageBucket: "twincare-ai-7a018.firebasestorage.app",
    messagingSenderId: "706086757079",
    appId: "1:706086757079:web:4364bf7774867f503d8692"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.firebaseSignUp = async function(email, password) {
    try {
      await createUserWithEmailAndPassword(auth, email, password);
      alert("Account created successfully! 🎉");
    } catch (error) {
      alert(error.message);
    }
  };

  window.firebaseSignIn = async function(email, password) {
    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert("Signed in successfully! 🎉");
    } catch (error) {
      alert(error.message);
    }
  };

  window.firebaseSignOut = async function() {
    await signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("Logged in:", user.email);
    } else {
      console.log("No user signed in");
    }
  });
</script>

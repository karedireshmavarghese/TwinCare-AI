<script type="module">
  // Keep your existing Firebase imports and authentication code above this.

  window.sendChatMessage = async function () {
    const input = document.getElementById("chatInput");
    const messages = document.getElementById("chatMessages");

    if (!input || !messages) {
      console.error("Chat elements not found.");
      return;
    }

    const message = input.value.trim();

    if (!message) return;

    // User message
    const userMessage = document.createElement("div");
    userMessage.className = "userMessage";
    userMessage.textContent = message;
    messages.appendChild(userMessage);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    // Typing indicator
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "TwinCare Assistant is thinking...";
    messages.appendChild(typing);

    messages.scrollTop = messages.scrollHeight;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      });

      const rawText = await response.text();

      let data;

      try {
        data = JSON.parse(rawText);
      } catch {
        data = {
          error: rawText || "Invalid server response."
        };
      }

      typing.remove();

      if (!response.ok) {
        throw new Error(
          data.error || `Server error (${response.status})`
        );
      }

      if (!data.reply) {
        throw new Error("AI returned an empty response.");
      }

      const botMessage = document.createElement("div");
      botMessage.className = "botMessage";
      botMessage.textContent = data.reply;

      messages.appendChild(botMessage);
      messages.scrollTop = messages.scrollHeight;

    } catch (error) {
      typing.remove();

      const errorMessage = document.createElement("div");
      errorMessage.className = "botMessage";
      errorMessage.textContent = "⚠️ " + error.message;

      messages.appendChild(errorMessage);
      messages.scrollTop = messages.scrollHeight;

      console.error("TwinCare chatbot error:", error);
    }
  };
</script>
